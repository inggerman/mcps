[project]
name = "mcp-documentation"
version = "1.0.0"
description = "MCP server expert in documentation: read, write, classify, index, track sessions, generate diagrams"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "mistune>=3.0",
    "python-frontmatter>=1.1",
    "mdformat>=0.7",
    "markdown>=3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "xmltodict>=0.13",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "mcp-shared",
]

[tool.uv.sources]
mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_documentation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
