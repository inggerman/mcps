[project]
name = "mcp-covaf-data"
version = "1.0.0"
description = "MCP server for COVAF data formats: read/parse PDF, Excel, Word, XML, JSON, JSON-PDF, JSON-Word, XML-Short, validate extraction results"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "respx>=0.21",
    "defusedxml>=0.7",
    "mcp-shared",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11", "pymupdf>=1.24"]
excel = ["openpyxl>=3.1"]
all = ["pdfplumber>=0.11", "pymupdf>=1.24", "openpyxl>=3.1"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "openpyxl>=3.1",
]

[tool.uv.sources]
mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_covaf_data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]
