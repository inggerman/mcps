[project]
name = "mcp-config-sync"
version = "1.0.0"
description = "MCP server for k8s ConfigMap and Secret sync: list, diff, compare across namespaces"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "rich>=13.7",
    "mcp-shared",
    "kubernetes>=30.0",
]

[tool.uv.sources]
mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_config_sync"]
