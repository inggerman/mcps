[project]
name = "mcp-calendar"
version = "1.0.0"
description = "MCP server for business days calculation and currency exchange rates"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "holidays>=0.52",
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "tzdata>=2024.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "rich>=13.7",
    "mcp-shared",
]

[tool.uv.sources]
mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_calendar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
