[project]
name = "mcp-gob-mexico"
version = "1.0.0"
description = "MCP server for Mexican government free APIs (INEGI, Banxico, SAT, PROFECO, etc.)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "rich>=13.7",
    "mcp-shared",
]

[tool.uv.sources]
mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gob_mexico"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]
