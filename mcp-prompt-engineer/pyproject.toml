[project]
name = "mcp-prompt-engineer"
version = "1.0.0"
description = "MCP server for analyzing and improving LLM prompts"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9",
    "tiktoken>=0.7",
    "langdetect>=1.0.9",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "rich>=13.7",
    "mcp-shared",
]

[tool.uv.sources]
mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_prompt_engineer"]
