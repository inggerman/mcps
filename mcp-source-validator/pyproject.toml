[project]
name = "mcp-source-validator"
version = "1.0.0"
description = "MCP server for validating web sources: URL trust scoring, content validation"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "rich>=13.7",
    "mcp-shared",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[tool.uv.sources]
mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_source_validator"]
