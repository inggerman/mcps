[project]
name = "mcp-database"
version = "1.0.0"
description = "MCP server for safe SQL database inspection and queries"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "mcp-shared",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
]

[tool.uv.sources]
mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_database"]
