apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-credential-broker
  namespace: mcp-services
  labels:
    app: mcp-credential-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-credential-broker
  template:
    metadata:
      labels:
        app: mcp-credential-broker
    spec:
      containers:
      - name: mcp-credential-broker
        image: harbor.mrrobot.fs/ghl/mcp-credential-broker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8056
        env:
        - name: MCP_TRANSPORT
          value: streamable-http
        - name: MCP_HOST
          value: 0.0.0.0
        - name: MCP_PORT
          value: '8056'
        - name: BROKER_KEYCHAIN_ENABLED
          value: 'false'
        - name: BROKER_HITL_AUTO_DENY
          value: 'true'
        - name: BROKER_SSH_HOSTS
          value: windows:100.73.65.63,wsl:100.115.230.9
        - name: BROKER_SSH_KEY_REF
          value: vault:secret/credential-broker/ssh-key#private
        - name: BROKER_LMSTUDIO_URL
          value: http://host.docker.internal:1234/v1
        - name: BROKER_LMSTUDIO_MODEL
          value: qwen3-8b
        - name: BROKER_VAULT_URL
          value: https://vault.mrrobot.fs
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          tcpSocket:
            port: 8056
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 8056
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-credential-broker
  namespace: mcp-services
  labels:
    app: mcp-credential-broker
spec:
  selector:
    app: mcp-credential-broker
  ports:
  - port: 8056
    targetPort: 8056
    name: http
  type: ClusterIP
