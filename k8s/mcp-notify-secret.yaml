# =============================================================================
# mcp-notify-secrets — Kubernetes Secret
# =============================================================================
# Contains credentials for Telegram, SMTP and Slack notifications.
#
# APPLY THIS MANUALLY with real values (do NOT commit real values):
#
#   kubectl create secret generic mcp-notify-secrets \
#     --namespace mcps \
#     --from-literal=NOTIFY_SMTP_USER='your-email@gmail.com' \
#     --from-literal=NOTIFY_SMTP_PASSWORD='your-app-password' \
#     --from-literal=NOTIFY_SMTP_FROM='your-email@gmail.com' \
#     --from-literal=NOTIFY_TELEGRAM_BOT_TOKEN='123456789:ABCdef...' \
#     --from-literal=NOTIFY_TELEGRAM_CHAT_ID='123456789' \
#     --from-literal=NOTIFY_SLACK_WEBHOOK_URL='https://hooks.slack.com/services/T.../B.../...' \
#     --from-literal=NOTIFY_SLACK_CHANNEL='#engineering'
#
# Or edit this manifest with base64-encoded values and apply:
#   kubectl apply -f k8s/mcp-notify-secret.yaml
#
# The values below are PLACEHOLDERS (base64 of "REPLACE_ME").
# Replace with your actual base64-encoded values before applying.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: mcp-notify-secrets
  namespace: mcps
  labels:
    app: mcp-notify
    managed-by: manual
type: Opaque
stringData:
  # SMTP (Email)
  NOTIFY_SMTP_USER: "REPLACE_ME"
  NOTIFY_SMTP_PASSWORD: "REPLACE_ME"
  NOTIFY_SMTP_FROM: "REPLACE_ME"

  # Telegram
  NOTIFY_TELEGRAM_BOT_TOKEN: "REPLACE_ME"
  NOTIFY_TELEGRAM_CHAT_ID: "REPLACE_ME"

  # Slack
  NOTIFY_SLACK_WEBHOOK_URL: "REPLACE_ME"
  NOTIFY_SLACK_CHANNEL: "#engineering"
