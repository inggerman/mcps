apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-credential-broker
  namespace: mcp-services
  annotations:
    konghq.com/strip-path: "false"
    kubernetes.io/ingress.class: kong
spec:
  rules:
  - host: mcp-credential-broker.mrrobot.fs
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-credential-broker
            port:
              number: 8056
