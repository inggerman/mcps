apiVersion: v1
kind: Namespace
metadata:
  name: mcps
  labels:
    istio-injection: disabled
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcp-data
  namespace: mcps
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcp-memory
  namespace: mcps
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcp-personal-vault
  namespace: mcps
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tabular
  namespace: mcps
  labels:
    app: mcp-tabular
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-tabular
  template:
    metadata:
      labels:
        app: mcp-tabular
    spec:
      containers:
      - name: mcp-tabular
        image: harbor.mrrobot.fs/ghl/mcp-tabular:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: MCP_TRANSPORT
          value: streamable-http
        - name: MCP_HOST
          value: 0.0.0.0
        - name: MCP_PORT
          value: '8001'
        - name: TABULAR_ALLOWED_ROOT
          value: /data
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          tcpSocket:
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: mcp-data
          mountPath: /data
          readOnly: true
      restartPolicy: Always
      volumes:
      - name: mcp-data
        persistentVolumeClaim:
          claimName: mcp-data
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tabular
  namespace: mcps
  labels:
    app: mcp-tabular
spec:
  selector:
    app: mcp-tabular
  ports:
  - port: 8001
    targetPort: 8001
    name: http
  type: ClusterIP
---
