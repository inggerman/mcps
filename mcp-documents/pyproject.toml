[project]
name = "mcp-documents"
version = "1.0.0"
description = "MCP server for PDF, DOCX and PPTX extraction"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "mcp-shared",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "structlog>=24.1",
]

[tool.uv.sources]
mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_documents"]
