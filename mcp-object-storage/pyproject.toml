[project]
name = "mcp-object-storage"
version = "1.0.0"
description = "MCP server for S3-compatible object storage"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "fastmcp>=2.3",
    "mcp-shared",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[tool.uv.sources]
mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_object_storage"]
