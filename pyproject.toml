[tool.uv.workspace]
members = [
    "shared",
    "mcp-tabular",
    "mcp-calendar",
    "mcp-markdown",
    "mcp-prompt-engineer",
    "mcp-structured-output",
    "mcp-fetch",
    "mcp-docker",
    "mcp-kafka",
    # Fase 1 — Fundamentos
    "mcp-project-memory",
    "mcp-llm-router",
    # Fase 2 — Desarrollo
    "mcp-git",
    "mcp-github",
    # Fase 3 — Calidad
    "mcp-code-quality",
    "mcp-architecture",
    # Fase 4 — Patrones Avanzados
    "mcp-event-driven",
    "mcp-orchestrator",
    # Fase 5 — Estándares
    "mcp-best-practices",
    "mcp-ci-cd",
    # Fase 6 — Arquitectura y Seguridad
    "mcp-design-patterns",
    "mcp-security-champion",
    # Fase 6 - Datos
    "mcp-database",
    "mcp-filesystem",
    "mcp-object-storage",
    # Fase 7 - Interfaces
    "mcp-openapi",
    "mcp-documents",
    "mcp-browser",
    # Fase 8 - Plataforma
    "mcp-kubernetes",
    "mcp-observability",
    "mcp-terraform",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations
    "PTH", # use pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "ANN401",
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF022",
    "S101",
    "S104",
    "S105",
    "S110",
    "S112",
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = false
explicit_package_bases = true
exclude = ["(^|[\\\\/])tests([\\\\/]|$)"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = false
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --tb=short --import-mode=importlib"

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
show_missing = true
fail_under = 55

[dependency-groups]
dev = [
    "mypy==1.10.0",
    "pre-commit>=3.7",
    "pytest>=9.0.3",
    "pytest-anyio>=0.0.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-PyYAML>=6.0",
]
