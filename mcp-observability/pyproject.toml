[project]
name = "mcp-observability"
version = "1.0.0"
description = "MCP server for Prometheus, Loki and generic health endpoints"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "httpx>=0.27",
    "mcp-shared",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[tool.uv.sources]
mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_observability"]
