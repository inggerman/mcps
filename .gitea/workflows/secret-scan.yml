# Secret Scanning with Gitleaks
# Scans repo for hardcoded secrets, API keys, tokens, passwords
name: Secret Scan

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          echo "=== Scanning for secrets ==="
          gitleaks detect --source . --report-format json --report-path /tmp/gitleaks-report.json --redact || EXIT_CODE=$?
          if [ -f /tmp/gitleaks-report.json ]; then
            FINDINGS=$(cat /tmp/gitleaks-report.json | python3 -c "import sys,json; data=json.load(sys.stdin); print(len(data))" 2>/dev/null || echo "0")
            echo "Found $FINDINGS potential secrets"
            cat /tmp/gitleaks-report.json | python3 -c "
import sys,json
data=json.load(sys.stdin)
for f in data[:20]:
    print(f'  - {f.get(\"RuleID\",\"?\")} in {f.get(\"File\",\"?\")}:{f.get(\"StartLine\",\"?\")}')
" 2>/dev/null || true
          else
            echo "No secrets found"
          fi
          exit ${EXIT_CODE:-0}
