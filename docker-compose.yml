      - "mcp.version=1.0.0"
      - "mcp.transport=streamable-http"

  # ---------------------------------------------------------------------------
  # MCP: Structured Output (Bedrock + OpenAI-compatible)
  # ---------------------------------------------------------------------------
  mcp-structured-output:
    build:
