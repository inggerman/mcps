    image: mcp-terraform:latest
    container_name: mcp-terraform
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8029"
      TERRAFORM_ROOT: /workspace
      TERRAFORM_ALLOW_APPLY: "false"
    ports:
      - "127.0.0.1:8029:8029"
    volumes:
      - .:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8029), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "mcp.server=terraform"
      - "mcp.version=1.0.0"
      - "mcp.transport=streamable-http"

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  mcp-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MCP_DATA_DIR:-./data}
  mcp-memory:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MCP_MEMORY_DIR:-./.ai-memory}
