  # ---------------------------------------------------------------------------
  # MCP: Docker (containers, images, logs, exec)
  # ---------------------------------------------------------------------------
  mcp-docker:
    profiles: ["privileged-tools"]
    build:
      context: .
      dockerfile: mcp-docker/Dockerfile
      target: runtime
    image: mcp-docker:latest
    container_name: mcp-docker
