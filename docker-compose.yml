    labels:
      - "mcp.server=structured-output"
      - "mcp.version=1.0.0"
      - "mcp.transport=streamable-http"

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  mcp-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MCP_DATA_DIR:-./data}
