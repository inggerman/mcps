# =============================================================================
# MCP Framework — docker-compose (HTTP / Streamable-HTTP mode)
#
# Todos los servidores corren con MCP_TRANSPORT=streamable-http y exponen
# un puerto HTTP. Para uso local con stdio (Claude Desktop / Cursor) usa
# `uv run python -m mcp_X.server` directamente o `docker run --rm -i`.
#
# Puertos:
#   8001 — mcp-tabular
#   8002 — mcp-calendar
#   8003 — mcp-markdown
#   8004 — mcp-prompt-engineer
#   8005 — mcp-structured-output
#   8006 — mcp-fetch
#   8007 — mcp-docker
#   8008 — mcp-kafka
#   8009 — mcp-project-memory
#   8010 — mcp-llm-router
#   8011 — mcp-git
#   8012 — mcp-github
#   8013 — mcp-code-quality
#   8014 — mcp-architecture
#   8015 — mcp-event-driven
#   8016 — mcp-orchestrator
#   8017 — mcp-best-practices
#   8018 — mcp-ci-cd
#   8019 — mcp-design-patterns
#   8020 — mcp-security-champion
#   8021 — mcp-database
#   8022 — mcp-filesystem
#   8023 — mcp-object-storage
#   8024 — mcp-openapi
#   8025 — mcp-documents
#   8026 — mcp-browser
#   8027 — mcp-kubernetes
#   8028 — mcp-observability
#   8029 — mcp-terraform
#   8030 — mcp-snyk
#   8031 — mcp-sonar
#   8032 — mcp-java-build
#   8033 — mcp-agent-runner
#   8034 — mcp-personal-vault
#   8035 — mcp-gob-mexico
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MCP: Archivos tabulares (mcp-tabular)
  # ---------------------------------------------------------------------------
  mcp-tabular:
    build:
      context: .
      dockerfile: mcp-tabular/Dockerfile
      target: runtime
    image: mcp-tabular:latest
    container_name: mcp-tabular
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8001"
      TABULAR_ALLOWED_ROOT: "/data"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - mcp-data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "mcp.server=tabular"
      - "mcp.version=1.0.0"
      - "mcp.transport=streamable-http"

