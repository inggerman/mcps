    volumes:
      - mcp-data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8025), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "mcp.server=documents"
      - "mcp.version=1.0.0"
      - "mcp.transport=streamable-http"

  # ---------------------------------------------------------------------------
  # MCP: Browser (Playwright)
  # ---------------------------------------------------------------------------
  mcp-browser:
    profiles: ["browser"]
    build:
      context: .
      dockerfile: mcp-browser/Dockerfile
    image: mcp-browser:latest
    container_name: mcp-browser
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8026"
      BROWSER_HEADLESS: "true"
      BROWSER_OUTPUT_DIR: /data/browser
    ports:
      - "127.0.0.1:8026:8026"
    volumes:
      - mcp-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8026), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "mcp.server=browser"
      - "mcp.version=1.0.0"
      - "mcp.transport=streamable-http"

  # ---------------------------------------------------------------------------
