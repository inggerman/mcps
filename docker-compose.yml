  # ---------------------------------------------------------------------------
  mcp-kubernetes:
    profiles: ["platform-tools"]
    build:
      context: .
      dockerfile: mcp-kubernetes/Dockerfile
    image: mcp-kubernetes:latest
    container_name: mcp-kubernetes
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8027"
      KUBERNETES_ALLOW_WRITE: "false"
    ports:
      - "127.0.0.1:8027:8027"
    volumes:
      - ${KUBECONFIG_DIR:-./data/kube}:/home/mcpuser/.kube:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8027), timeout=5)"]
      interval: 30s
