    container_name: mcp-object-storage
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8023"
      OBJECT_STORAGE_ALLOW_WRITE: "false"
    ports:
      - "127.0.0.1:8023:8023"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8023), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "mcp.server=object-storage"
      - "mcp.version=1.0.0"
      - "mcp.transport=streamable-http"

  # ---------------------------------------------------------------------------
  # MCP: OpenAPI
  # ---------------------------------------------------------------------------
  mcp-openapi:
    build:
      context: .
      dockerfile: mcp-openapi/Dockerfile
    image: mcp-openapi:latest
    container_name: mcp-openapi
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8024"
      OPENAPI_SPEC: /data/openapi.yaml
      OPENAPI_ALLOWED_ROOT: /data
      OPENAPI_ALLOW_INVOKE: "false"
    ports:
      - "127.0.0.1:8024:8024"
    volumes:
      - mcp-data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8024), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "mcp.server=openapi"
      - "mcp.version=1.0.0"
      - "mcp.transport=streamable-http"

  # ---------------------------------------------------------------------------
  # MCP: Documents (PDF, DOCX and PPTX)
  # ---------------------------------------------------------------------------
  mcp-documents:
    build:
      context: .
      dockerfile: mcp-documents/Dockerfile
    image: mcp-documents:latest
    container_name: mcp-documents
    restart: unless-stopped
