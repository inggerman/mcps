  # ---------------------------------------------------------------------------
  mcp-observability:
    profiles: ["platform-tools"]
    build:
      context: .
      dockerfile: mcp-observability/Dockerfile
    image: mcp-observability:latest
    container_name: mcp-observability
    restart: unless-stopped
    env_file:
      - path: .env
