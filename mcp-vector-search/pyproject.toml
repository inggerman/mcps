[project]
name = "mcp-vector-search"
version = "1.0.0"
description = "MCP server for vector search with Qdrant: upsert, search, collections, embeddings via LM Studio"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "rich>=13.7",
    "mcp-shared",
    "qdrant-client>=1.12",
    "httpx>=0.27",
]

[tool.uv.sources]
mcp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vector_search"]
